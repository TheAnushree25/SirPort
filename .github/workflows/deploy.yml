# Type-checks and builds the site on every push and pull request, and publishes
# `main` to GitHub Pages.
#
# One-time setup: repository Settings → Pages → Build and deployment →
# Source: "GitHub Actions". Until then the site is still type-checked and built
# on every push, and the deploy job is skipped. The base path (/<repo>/ for a
# project site) and the site URL — including a custom domain set on that page —
# are picked up automatically. Repository variables SITE_URL / BASE_PATH
# override them.
name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One run per branch; pull request builds are superseded by newer commits,
# deployments of `main` are never cancelled midway.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      # True when GitHub Pages is enabled for the repository and a deploy should follow.
      pages: ${{ steps.pages.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v7

      - name: Read GitHub Pages settings
        id: pages
        if: github.event_name != 'pull_request'
        # Pages may not be enabled yet; build anyway and skip the deploy.
        continue-on-error: true
        uses: actions/configure-pages@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL || steps.pages.outputs.origin }}
          BASE_PATH: ${{ vars.BASE_PATH || steps.pages.outputs.base_path }}

      - name: Upload the built site
        if: github.event_name != 'pull_request' && steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Note that deployment is waiting for GitHub Pages
        if: github.event_name != 'pull_request' && steps.pages.outcome != 'success'
        run: echo "::warning title=GitHub Pages is not enabled::Built successfully but not deployed. Enable Settings → Pages → Source → GitHub Actions, then re-run this workflow."

  deploy:
    if: github.event_name != 'pull_request' && needs.build.outputs.pages == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
